jwt:
  secret: ${JWT_SECRET} # 這裡會自動去讀環境變數中的 JWT_SECRET
spring:
  application:
    name: echo-gallery-backend
  # PostgreSQL 連線設定
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/echogallery}
    username: ${DB_USERNAME:${POSTGRES_USER}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:3}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}

  # 結構變更須先人工審閱並執行 SQL；啟動時僅驗證，不自動改表。
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  demo:
    enabled: ${DEMO_ENABLED:false}
    session-ttl-hours: ${DEMO_SESSION_TTL_HOURS:24}
    cleanup:
      enabled: ${DEMO_CLEANUP_ENABLED:true}
      fixed-delay-ms: ${DEMO_CLEANUP_FIXED_DELAY_MS:900000}

services:
  backend:
    build:
      context: ./echo-gallery-backend
      dockerfile: Dockerfile
    image: echo-gallery-backend:${APP_VERSION:-local}
    restart: unless-stopped
    env_file:
      - ${BACKEND_ENV_FILE:-/etc/echo-gallery/backend.env}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
